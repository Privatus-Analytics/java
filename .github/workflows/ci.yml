name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
        spring-boot: ["3.5.7"]
        include:
          - java: "17"
            spring-boot: "3.2.12"
          - java: "21"
            spring-boot: "3.4.11"
    name: Java ${{ matrix.java }}, Spring Boot ${{ matrix.spring-boot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp test -Dspotless.check.skip=true -Dspring-boot.version=${{ matrix.spring-boot }}

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Tests, the Spotless (google-java-format) check, jars, sources and javadoc.
      - run: mvn -B -ntp verify
